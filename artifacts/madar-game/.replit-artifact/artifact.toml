kind = "web"
previewPath = "/"
title = "مَدار — لعبة تعليمية"
description = "لعبة معرفية إسلامية بالعربية والإنجليزية، يتنافس فيها اللاعبون على رقعة دائرية عبر بطاقات اعرف واستكشف وحلّل، وتستمر حتى يصل أحدهم إلى سقف النقاط."
version = "1.0.0"
id = "artifacts/madar-game"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23460

[services.development]
run = "pnpm --filter @workspace/madar-game run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/madar-game", "run", "build" ]
serve = "static"
publicDir = "artifacts/madar-game/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23460"
BASE_PATH = "/"
