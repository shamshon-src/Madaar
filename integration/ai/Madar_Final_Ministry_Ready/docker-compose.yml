services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: madar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: madar
    ports:
      - "5432:5432"
    volumes:
      - madar_pgdata:/var/lib/postgresql/data

volumes:
  madar_pgdata:
