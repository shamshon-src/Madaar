<?xml version="1.0" encoding="UTF-8"?>
<svg id="Layer_1" data-name="Layer 1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1007 940">
  <defs>
    <style>
      #body-group, #head-group, #arm-left, #arm-right, #eye-left, #eye-right, #antenna-light, #chest-screen {
        transform-box: view-box;
      }
      #body-group { transform-origin: 503px 680px; animation: var(--falak-body-animation, none); }
      #head-group { transform-origin: 505px 320px; animation: var(--falak-head-animation, none); }
      #arm-left { transform-origin: 290px 650px; animation: var(--falak-left-arm-animation, none); }
      #arm-right { transform-origin: 720px 650px; animation: var(--falak-right-arm-animation, none); }
      #eye-left, #eye-right { transform-origin: center; animation: var(--falak-eye-animation, none); }
      #eye-left ellipse, #eye-right ellipse { opacity: var(--falak-open-eye-opacity, 1); animation: var(--falak-blink-animation, none); }
      #eye-left .eye-blink-line, #eye-right .eye-blink-line { opacity: var(--falak-closed-eye-opacity, 0); animation: var(--falak-blink-line-animation, none); }
      #antenna-light { animation: var(--falak-antenna-animation, none); }
      #chest-logo { opacity: var(--falak-logo-opacity, 1); }
      #chest-screen { animation: var(--falak-screen-animation, none); }
      #chest-thinking, #chest-explaining, #chest-success, #chest-error { opacity: 0; }
      #chest-thinking { opacity: var(--falak-thinking-opacity, 0); transform-box: view-box; transform-origin: 506px 622px; animation: var(--falak-thinking-animation, none); }
      #chest-explaining { opacity: var(--falak-explaining-opacity, 0); animation: var(--falak-explaining-animation, none); }
      #chest-success { opacity: var(--falak-success-opacity, 0); animation: var(--falak-success-animation, none); }
      #chest-error { opacity: var(--falak-error-opacity, 0); animation: var(--falak-error-animation, none); }
      .cls-1 {
        fill: #195c8e;
      }

      .cls-2 {
        fill: #eea727;
      }

      .cls-3 {
        fill: #103e5b;
      }

      .cls-4 {
        fill: #1f1b44;
      }

      .cls-5 {
        fill: #165175;
      }

      .cls-6 {
        fill: #b7232b;
      }
      @keyframes falak-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
      @keyframes falak-head-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
      @keyframes falak-blink { 0%, 46%, 50%, 100% { opacity: 1; } 48% { opacity: 0; } }
      @keyframes falak-blink-line { 0%, 46%, 50%, 100% { opacity: 0; } 48% { opacity: 1; } }
      @keyframes falak-thinking-head { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(6deg); } }
      @keyframes falak-thinking-light { from { opacity: .3; filter: drop-shadow(0 0 1px #c92835); } to { opacity: 1; filter: drop-shadow(0 0 8px #ff3645); } }
      @keyframes falak-gear-turn { to { transform: rotate(360deg); } }
      @keyframes falak-reading { 0%, 100% { transform: translateX(-3px); } 50% { transform: translateX(3px); } }
      @keyframes falak-explain-arm { 0%, 12% { transform: rotate(0); } 38%, 56% { transform: rotate(-28deg); } 82%, 100% { transform: rotate(0); } }
      @keyframes falak-explain-head { 0%, 25% { transform: rotate(0); } 55% { transform: rotate(6deg); } 82%, 100% { transform: rotate(0); } }
      @keyframes falak-explain-glow { from { filter: drop-shadow(0 0 1px #f0a92a); } to { filter: drop-shadow(0 0 10px #f0a92a); } }
      @keyframes falak-screen-glow { from { filter: drop-shadow(0 0 0 #22cc6600); } to { filter: drop-shadow(0 0 12px #22cc6688); } }
      @keyframes falak-celebrate-left { from { transform: rotate(0); } to { transform: rotate(-9deg); } }
      @keyframes falak-celebrate-right { from { transform: rotate(0); } to { transform: rotate(9deg); } }
      @keyframes falak-success-light { from { filter: drop-shadow(0 0 1px #22cc66); } to { filter: drop-shadow(0 0 8px #22cc66); } }
      @keyframes falak-error-shake { 0%, 100% { transform: translateX(0); } 25%, 75% { transform: translateX(5px); } 50% { transform: translateX(-5px); } }
      @keyframes falak-error-lower { to { transform: translateY(8px); } }
      @keyframes falak-error-arms { to { transform: rotate(-5deg); } }
      @media (prefers-reduced-motion: reduce) { #body-group, #head-group, #arm-left, #arm-right, #eye-left, #eye-right, #antenna-light, #chest-thinking, #chest-explaining, #chest-success, #chest-error { animation-duration: .01ms !important; } }
    </style>
