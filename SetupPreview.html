<head>
<meta charset="utf-8">

<title>مدار - الإعداد والتخصيص</title>

<style>
body{margin:0}
a{color:#0A3F70}a:hover{color:#0B2545}
:root{color-scheme:light;--ink:#082b5c;--muted:#425b7d;--line:#e1eaf4;--blue:#082f69;--green:#e1f7ea}
*{box-sizing:border-box}
body{background:#f3f8fd;color:var(--ink);font-family:'Readex Pro',Tahoma,sans-serif}
body>div{min-height:100vh!important;background:#f3f8fd!important;color:var(--ink)!important}
header{min-height:70px;padding:0 30px!important;border-bottom-color:#e4edf5!important;flex-wrap:nowrap!important}
header>a:first-child img{width:38px!important;height:42px!important}
header nav{gap:12px!important}
header nav a{color:var(--ink)!important}
header nav a:last-child{border-color:var(--line)!important;border-radius:12px!important}
main{max-width:1040px!important;padding:24px 0 64px!important;gap:22px!important}
main>div:first-child h1{font-size:30px!important;color:var(--ink)}
main>div:first-child p{color:var(--muted)!important}
main>div:nth-child(2){display:grid!important;grid-template-columns:minmax(0,654px) minmax(300px,328px);gap:20px!important;align-items:start!important;direction:rtl}
main>div:nth-child(2)>section{min-width:0!important;border-radius:20px!important;box-shadow:0 8px 22px rgba(16,49,87,.08)!important}
main>div:nth-child(2)>section:first-child{padding:24px!important;gap:16px!important}
main>div:nth-child(2)>section:first-child>div:first-child{display:none!important}
main>div:nth-child(2)>section:first-child>div{gap:8px!important}
main>div:nth-child(2)>section:first-child h2{font-size:14px!important;color:var(--ink)}
main>div:nth-child(2)>section:first-child>div:nth-of-type(2)>div>button:nth-child(3){display:none!important}
main>div:nth-child(2)>section:first-child button[role="radio"]{min-height:60px!important;border:1px solid var(--line)!important;background:#fff!important;border-radius:14px!important;padding:10px 12px!important;color:var(--ink)!important;transition:background .15s,border-color .15s}
main>div:nth-child(2)>section:first-child button[role="radio"].is-selected{border:2px solid var(--blue)!important;background:#e7f1fb!important}
main>div:nth-child(2)>section:first-child button[role="radio"]:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #83b5e7;outline-offset:2px}
.new-learner{display:flex;align-items:center;gap:12px;min-height:68px;padding:10px 14px;border:1px dotted #cad8e8;border-radius:14px;color:var(--ink)}
.new-learner input{width:20px;height:20px;margin:0;accent-color:var(--blue);flex:0 0 auto}
.new-learner span{display:flex;flex-direction:column;gap:3px}
.new-learner strong{font-size:14px}
.new-learner small{color:var(--muted);font-size:11px;line-height:1.5}
.topic-field{border:2px solid var(--blue)!important;border-radius:14px!important;min-height:54px}
.topic-field input{min-width:0!important;font-size:15px!important}
.topic-select{min-height:46px;border:1px solid var(--line);border-radius:13px;padding:0 14px;background:#fff;color:var(--ink);font:inherit;font-size:14px;width:100%}
.topic-help{font-size:12px!important;color:var(--muted)!important}
main>div:nth-child(2)>section:first-child>div:last-child>div{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px!important}
main>div:nth-child(2)>section:first-child>div:last-child>div>button{min-width:0!important;flex:initial!important;min-height:80px!important;padding:9px!important}
main>div:nth-child(2)>section:first-child>div:last-child>div>button>span:nth-child(2){min-width:0}
main>div:nth-child(2)>section:first-child>div:last-child>div>button>span:nth-child(2)>span:first-child{font-size:14px!important}
main>div:nth-child(2)>section:first-child>div:last-child>div>button>span:nth-child(2)>span:last-child{font-size:11px!important;line-height:1.4}
main>div:nth-child(2)>section:last-child{padding:20px!important;gap:14px!important;align-self:start!important}
main>div:nth-child(2)>section:last-child img{width:140px!important}
main>div:nth-child(2)>section:last-child a[href="Players.html"]{min-height:46px!important;border-radius:12px!important;background:var(--blue)!important}
main>div:nth-child(2)>section:last-child>div:nth-child(2){background:var(--green)!important;border-radius:12px!important}
@media(max-width:780px){header{padding:0 16px!important}main{padding:22px 16px 40px!important}main>div:nth-child(2){grid-template-columns:minmax(0,1fr);direction:rtl}main>div:nth-child(2)>section:last-child{grid-row:2}main>div:nth-child(2)>section:first-child>div:last-child>div{grid-template-columns:1fr!important}}
@media(max-width:430px){main>div:nth-child(2)>section:first-child{padding:18px!important}main>div:nth-child(2)>section:first-child>div:last-child>div>button{min-height:68px!important}}
</style>

</head>

ath></svg></span><span style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 600">جماعي على جهاز واحد</span><span style="font-size: 12px; color: #53627A">رقعة لوحية للفصل أو العائلة</span></span><span style="width: 22px; height: 22px; border-radius: 50%; border: 2px solid #0A3F70; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center"><span style="width: 10px; height: 10px; border-radius: 50%; background: #0A3F70"></span></span></button><button type="button" style="flex: 1 1 200px; min-height: 64px; border: 1px solid #DCE6F0; background: #FFFFFF; border-radius: 16px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; font-family: inherit; text-align: right; cursor: pointer; color: #0B2545"><span style="width: 40px; height: 40px; border-radius: 12px; background: #F4F8FC; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="flex-shrink: 0"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18" stroke="#0A3F70" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></span><span style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 600">تنافسي عن بُعد</span><span style="font-size: 12px; color: #53627A">غرفة برمز مع أصدقائك</span></span><span style="width: 22px; height: 22px; border-radius: 50%; border: 2px solid #A9B8CA; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center"></span></button></div></div>

<script>
(() => {
	const storageKey = "madaarSetup";
	const config = document.querySelector("main > div:nth-child(2) > section:first-child");
	let saved = {};
	try {
		saved = JSON.parse(localStorage.getItem(storageKey) || "{}");
	} catch {}

	config.querySelectorAll("h2").forEach((heading) => {
		const title = heading.textContent.trim();
		const groupName = title === "الفئة" ? "category" : title === "نمط اللعب" ? "mode" : null;
		if (!groupName) return;
		const buttons = [...heading.nextElementSibling.querySelectorAll(":scope > button")];
		if (groupName === "category") buttons.splice(2);
		buttons.forEach((button, index) => {
			button.dataset.optionGroup = groupName;
			button.dataset.optionValue = String(index);
			button.classList.add("radio-option");
			button.setAttribute("role", "radio");
			button.addEventListener("click", () => selectOption(groupName, button));
		});
		const requestedMode = new URLSearchParams(location.search).get("mode");
		const modeDefaults = { solo: 0, local: 1, remote: 2 };
		const defaultIndex = groupName === "category" ? 0 : modeDefaults[requestedMode] ?? 1;
		const savedIndex = Number(saved[groupName] ?? defaultIndex);
		const selectedIndex = groupName === "mode" && modeDefaults[requestedMode] !== undefined ? modeDefaults[requestedMode] : savedIndex;
		selectOption(groupName, buttons[selectedIndex] || buttons[defaultIndex]);
	});

	function selectOption(groupName, selectedButton) {
		if (!selectedButton) return;
		config.querySelectorAll(`[data-option-group="${groupName}"]`).forEach((button) => {
			const selected = button === selectedButton;
			button.classList.toggle("is-selected", selected);
			button.setAttribute("aria-checked", String(selected));
			button.tabIndex = selected ? 0 : -1;
		});
	}

	const topic = document.getElementById("topic");
	const topicList = document.getElementById("topic-list");
	const topicCategory = document.getElementById("topic-category");
	const topicSuggestion = document.getElementById("topic-suggestion");
	const topicGroups = {
		worship: ["الوضوء", "الصلاة", "الصيام", "الزكاة", "الحج"],
		transactions: ["البيع والشراء", "الأمانة في المعاملات", "الربا", "حفظ الحقوق", "الصدق في التجارة"],
		belief: ["التوحيد", "أركان الإيمان", "الإيمان بالملائكة", "الإيمان باليوم الآخر", "أسماء الله الحسنى"],
		history: ["الهجرة النبوية", "غزوة بدر", "صلح الحديبية", "فتح مكة", "السيرة النبوية"],
		quran: ["تفسير سورة الفاتحة", "أسباب النزول", "جمع القرآن", "قصص القرآن", "آداب تلاوة القرآن"],
		ethics: ["بر الوالدين", "صلة الرحم", "الرفق", "الأمانة", "آداب الحوار"]
	};
	const defaultTopics = ["الصيام", "بر الوالدين", "غزوة بدر"];
	const newLearner = document.getElementById("new-learner");
	topic.value = new URLSearchParams(location.search).get("topic") || saved.topic || "";
	topic.placeholder = "اكتب موضوعًا، مثل: الصيام، بر الوالدين، غزوة بدر";
	topicCategory.value = saved.topicCategory || "";
	function fillTopicList(group, selectedValue = "") {
		const topics = topicGroups[group] || defaultTopics;
		topicList.replaceChildren(new Option("اختر موضوعًا", ""));
		topics.forEach((name) => topicList.add(new Option(name, name)));
		topicList.value = topics.includes(selectedValue) ? selectedValue : "";
	}
	fillTopicList(topicCategory.value, saved.topicList || "");
	newLearner.checked = Boolean(saved.newLearner);
	topicCategory.addEventListener("change", () => fillTopicList(topicCategory.value));
	topicList.addEventListener("change", () => {
		if (topicList.value) topic.value = topicList.value;
	});
	document.getElementById("random-topic").addEventListener("click", () => {
		const topics = topicGroups[topicCategory.value] || Object.values(topicGroups).flat();
		const suggestion = topics[Math.floor(Math.random() * topics.length)];
		topic.value = suggestion;
		if (![...topicList.options].some((option) => option.value === suggestion)) topicList.add(new Option(suggestion, suggestion));
		topicList.value = suggestion;
		topicSuggestion.dataset.topicValue = suggestion;
		topicSuggestion.textContent = document.documentElement.lang === "en" ? `Random suggestion: ${suggestion}` : `اقتراح عشوائي: ${suggestion}`;
	});

	document.querySelector("main > div:first-child p").textContent = "خصّص رحلتك قبل أن تبدأ.";
	document.querySelector("main > div:nth-child(2) > section:last-child>div:first-child>div").textContent = "اختر مجالًا أو اكتب أي موضوع يخطر ببالك، وسأجهز لك الأسئلة!";
	const modeHeading = [...config.querySelectorAll("h2")].find((heading) => heading.textContent.trim() === "نمط اللعب");
	["لاعب، وحدك بأسلوبك", "رقعة لوحية للأسرة أو الفصل", "غرفة برمز مع أصدقائك"].forEach((description, index) => {
		const button = modeHeading.nextElementSibling.querySelectorAll(":scope > button")[index];
		const text = button?.querySelectorAll(":scope > span")[1]?.querySelectorAll("span")[1];
		if (text) text.textContent = description;
	});

	document.querySelector("main > div:nth-child(2) > section:last-child a[href='Players.html']").addEventListener("click", (event) => {
		const values = {};
		config.querySelectorAll("[data-option-group][aria-checked='true']").forEach((button) => {
			values[button.dataset.optionGroup] = Number(button.dataset.optionValue);
		});
		const destinations = ["Journey.html", "Players.html", "Room.html"];
		values.topic = topic.value.trim();
		values.topicList = topicList.value;
		values.topicCategory = topicCategory.value;
		values.newLearner = newLearner.checked;
		for (const key of ["madaarPlayers", "madaarPlayerColors", "madaarPlayerScores", "madaarGameState", "madaarPendingTurn", "madaarAnswer"]) localStorage.removeItem(key);
		try {
			localStorage.setItem(storageKey, JSON.stringify(values));
		} catch {}
		event.currentTarget.href = destinations[values.mode] || "Players.html";
	});
})();
</script>
