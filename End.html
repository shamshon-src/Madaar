<script>
(() => {
	document.querySelector("header img").src = "images/logo_1.png";
	let names = [];
	let target = "30";
	try {
		names = JSON.parse(localStorage.getItem("madaarPlayers") || "[]");
		target = localStorage.getItem("madaarTargetScore") || "30";
	} catch {}
	let state = {};
	try { state = JSON.parse(localStorage.getItem("madaarGameState") || "{}"); } catch {}
	const ranking = (state.names || names).map((name, index) => ({ name, score: Number(state.scores?.[index]) || 0, index })).sort((a, b) => b.score - a.score);
	const rankingSection = document.querySelector("main > div:first-child > div:last-child > section:first-child");
	const template = rankingSection.firstElementChild.cloneNode(true);
	rankingSection.replaceChildren();
	ranking.forEach((player, rank) => {
		const row = template.cloneNode(true);
		const spans = row.querySelectorAll("span");
		const sharedRank = ranking.findIndex(entry => entry.score === player.score) + 1;
		spans[0].textContent = String(sharedRank);
		spans[1].textContent = player.name;
		spans[2].textContent = `${player.score} نقطة`;
		row.style.background = rank === 0 ? "#E3F8EC" : "#FFFFFF";
		rankingSection.append(row);
	});
	const winnerLabel = document.querySelector("main > div:first-child > div:first-child > span:last-child");
	if (ranking.length && winnerLabel) {
		const icon = winnerLabel.querySelector("svg");
		winnerLabel.replaceChildren();
		if (icon) winnerLabel.append(icon);
		const winners = ranking.filter(player => player.score === ranking[0].score);
		winnerLabel.append(document.createTextNode(winners.length > 1 ? `الفائزون: ${winners.map(player => player.name).join('، ')}` : `الفائز: ${ranking[0].name}`));
	}
	const level = document.querySelector("main > div:first-child > div:last-child > section:last-of-type > div:nth-last-child(2) span:first-child");
	document.querySelectorAll('main section span').forEach(span=>{if(span.textContent.startsWith('مستواك في '))span.parentElement.remove();});
})();
</script>
