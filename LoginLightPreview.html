<!doctype html>
<html lang="ar" dir="rtl" data-theme="light"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>مدار — تسجيل الدخول</title><link rel="stylesheet" href="entry-pages.css"><link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="font-size.css"><script src="board-panel-layout.js"></script><link rel="stylesheet" href="board-panel-layout.css"><link rel="stylesheet" href="ui-fixes.css"></head>
<body class="login-page">
<header class="preview-header"><a class="preview-brand" href="Main.html"><img src="images/logo_1.png" alt="شعار مدار"><span>مَدَار</span></a><nav aria-label="التنقل"><a href="HowToPlay.html">كيف ألعب</a><a href="Main.html">رجوع</a></nav></header>
<main class="preview-main"><h1 class="preview-title">أهلًا بك في مَدَار</h1><p class="preview-subtitle">خطوة بسيطة وتبدأ رحلتك.</p>
<div class="preview-layout">
<section class="preview-panel" aria-labelledby="login-title"><h2 id="login-title">تسجيل الدخول</h2><p>ادخل بحسابك، أو ابدأ اللعب مباشرة.</p>
<form class="preview-form" id="login-preview-form">
<label for="account">البريد الإلكتروني<input class="preview-input" id="account" name="account" type="email" placeholder="أدخل بريدك الإلكتروني" autocomplete="off" required></label>
<label for="password">كلمة المرور<span class="preview-password"><input class="preview-input" id="password" name="password" type="password" placeholder="أدخل كلمة المرور" autocomplete="off" required><button id="toggle-password" type="button" aria-controls="password" aria-pressed="false">إظهار</button></span></label>
<button class="preview-primary" type="submit">دخول</button><p class="preview-status" id="login-status" role="status"></p>
</form>
<div class="preview-divider">أو</div><a class="preview-secondary preview-quick" href="Main.html">اللعب السريع</a><p class="preview-caption">ابدأ رحلتك دون تسجيل الدخول.</p><p class="preview-caption">دخول الحساب تجريبي حاليًا إلى حين ربط خدمة الحسابات.</p>
</section>
<aside class="preview-panel preview-falak"><div class="preview-bubble">أنا فَلَك، رفيقك في الرحلة!<br>جاهز نتعلّم ونلعب معًا؟</div><img src="images/falak.png" alt="فَلَك، رفيقك في مدار"><div class="falak-gallery"><img src="images/falak_correct.png" alt="فلك يشجعك"><img src="images/falak_thinking.png" alt="فلك يفكر"></div><small>كل سؤال بداية لمعرفة جديدة.</small></aside>
</div>
</main>
<script src="session-service.js"></script>
<script>
const password=document.getElementById('password');const toggle=document.getElementById('toggle-password');
toggle.addEventListener('click',()=>{const visible=password.type==='password';password.type=visible?'text':'password';toggle.textContent=visible?'إخفاء':'إظهار';toggle.setAttribute('aria-pressed',String(visible));});
document.getElementById('login-preview-form').addEventListener('submit',event=>{event.preventDefault();MadaarSession.start('account-preview');password.value='';location.href='Main.html';});
document.querySelector('.preview-quick').addEventListener('click',()=>MadaarSession.start('guest'));
</script>
</body></html>
